version: 1
mode: sshclient
settings:
    host:
      address: "192.168.0.35"
      port: 8080
    window:
        screen: 0
        width: 100%
        height: 300
        rotation: 270
        position:
            x: 0
            y: 100%
        origin:
            x: 0
            y: 100%
        transparent: false
        decorations: true
        pinned: false
    pages:
        - id: main
          grid:
              columns: 8
              rows: 2
              cells:
                  - x: 0
                    y: 0
                    width: 4
                    height: 1
                    widget: redBlock
                  - x: 0
                    y: 1
                    width: 4
                    height: 1
                    widget: greenBlock
                  - x: 4
                    y: 0
                    width: 2
                    height: 2
                    widget: blueBlock
                  - x: 6
                    y: 0
                    width: 2
                    height: 2
                    widget: blueBlock
    widgets:
        - id: redBlock
          type: block
          params:
              color: "#ff0000"
        - id: greenBlock
          type: block
          params:
              color: "#00ff00"
        - id: blueBlock
          type: block
          params:
              color: "#0000ff"

